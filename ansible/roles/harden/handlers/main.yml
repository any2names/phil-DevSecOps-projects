---
- name: Restart sshd
  ansible.builtin.service:
    name: ssh
    state: restarted
  when: not harden_in_container

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Restart auditd
  ansible.builtin.service:
    name: auditd
    state: restarted

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
  when: not harden_in_container
