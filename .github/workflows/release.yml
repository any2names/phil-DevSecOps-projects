name: release
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.img.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compute image name
        id: img
        # GHCR rejects uppercase in a repository path, and github.repository keeps the
        # original casing, so the name is lowercased once here and reused everywhere.
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/secure-api" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ steps.img.outputs.name }}
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false # SLSA provenance is produced by the dedicated job below
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ./platformctl
      - name: SBOM, sign, attest, verify
        run: |
          REF="${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}"
          platformctl sbom "$REF" --out sbom.spdx.json
          platformctl sign "$REF" --sbom sbom.spdx.json
          platformctl verify "$REF" --identity-regexp "^https://github.com/${{ github.repository }}/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.spdx.json

  provenance:
    needs: build
    permissions:
      actions: read
      id-token: write
      packages: write
    # SLSA generator must be referenced by tag; platformctl actions pin skips it on purpose.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
    with:
      image: ${{ needs.build.outputs.image }}
      digest: ${{ needs.build.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
