[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "platformctl"
version = "0.1.0"
description = "Orchestration CLI for the secure-api-platform: plan, policy, scan, drift, secrets, certs, supply chain."
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "structlog>=24.1",
  "rich>=13.7",
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "mypy>=2.3.1", "ruff>=0.6", "types-PyYAML"]
azure = ["azure-identity>=1.17", "azure-keyvault-secrets>=4.8", "azure-keyvault-certificates>=4.8"]
aws = ["boto3>=1.34"]

[project.scripts]
platformctl = "platformctl.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["platformctl*"]
